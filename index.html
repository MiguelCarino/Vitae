    <style>
        /* --- CORE STYLES --- */
        :root {
            --cv-accent: #0ea5e9; /* the résumé's own colour, picked in the rail */
            --page-margin: 35px;
            --module-gap: 15px; /* vertical space between stacked sections */
            --item-gap: 0px;    /* internal space inside a section */
        }
        
        /* PAGE DIMENSIONS */
        .page-container {
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            color: #1e293b;
            line-height: 1.5;
            padding: var(--page-margin);
            overflow: visible; 
            transition: width 0.3s, min-height 0.3s;
        }
        
        /* Size Classes */
        .size-a4 { width: 210mm; min-height: 297mm; }
        .size-letter { width: 215.9mm; min-height: 279.4mm; }
        .size-legal { width: 215.9mm; min-height: 355.6mm; }

        /* The Grid. Column gap separates the two tracks; row gap is the
           section rhythm, so --module-gap alone controls vertical spacing. */
        .resume-grid { display: grid; grid-template-columns: 7fr 5fr; column-gap: 2.5rem; row-gap: var(--module-gap); }
        /* ATS mode. The child override matters: col-left/col-right pin an
           explicit grid-column, which would otherwise conjure an implicit
           second track back into existence. */
        .resume-grid.ats { grid-template-columns: 1fr; column-gap: 0; }
        .resume-grid.ats > * { grid-column: 1 / -1; }
        .col-full { grid-column: 1 / -1; }
        .col-left { grid-column: 1 / 2; }
        .col-right { grid-column: 2 / 3; }
        
        /* SPACING SYSTEM */
        .section-item {
            position: relative;
            break-inside: avoid;
        }

        /* Internal spacing */
        .dynamic-gap { gap: var(--item-gap); }
        .dynamic-mb { margin-bottom: var(--item-gap); }
        .tag-container { gap: var(--item-gap); }
        
        /* Links */
        .page-container a { color: var(--cv-accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
        .page-container a:hover { border-bottom-style: solid; }

        /* Print Overrides - STRICT GAP REMOVAL */
        @media print {
            body, html { background: white; margin: 0; padding: 0; overflow: visible; height: 100%; }
            #app-ui, .no-print, .menu-bridge, .page-delete-btn,
            .ws-rail, .ws-scrim, .ws-toggle, .vitae-add, .toast { display: none !important; }
            .ws, .ws-pane { display: block; min-height: 0; padding: 0; overflow: visible; background: white; }
            .vitae-doc { zoom: 1 !important; padding: 0; gap: 0; }
            
            .page-container {
                box-shadow: none; 
                margin: 0; 
                padding: var(--page-margin) !important;
                border: none; 
                page-break-after: always;
                /* Do NOT reassert the on-screen paper height here. .size-* is
                   exactly one sheet, and @page margin is 0, so any rounding
                   over that emits a trailing blank page. page-break-after
                   already does the pagination. */
                min-height: 0;
                height: auto;
            }
            .page-container:last-child { page-break-after: auto; }
            
            /* Ensure icons align perfectly in print */
            .icon-wrapper { margin-right: 6px !important; display: inline-block; vertical-align: middle; }

            /* Empty fields must not print their placeholder. CSS-generated
               content also lands in the PDF text layer, which breaks ATS
               parsing as well as looking like stray grey text. */
            .editable:empty:before { content: none !important; }
        }

        /* Editable Areas */
        .editable { min-width: 10px; display: inline-block; }
        .editable:empty:before { content: attr(placeholder); opacity: 0.3; }
        .editable:focus { outline: none; background: rgba(234,179,8,.15); border-radius: 2px; }
        
        /* Control Menu Bridge */
        .menu-bridge { position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px; }
        
        /* Info popover at the foot of the Add rail */
        .sidebar-tooltip {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            right: 4.5rem;
            bottom: 1.5rem;
            width: 250px;
            background: var(--bg-elev);
            color: var(--text-sec);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s;
            z-index: 100;
            font-size: var(--fs-sm);
            line-height: 1.4;
        }
        .sidebar-tooltip.active { visibility: visible; opacity: 1; pointer-events: auto; }
        .sidebar-tooltip a { color: var(--text); }
        .sidebar-tooltip a:hover { color: var(--accent); }

        /* Colour swatches in the settings rail */
        .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .color-btn { width: 100%; height: 22px; border-radius: 4px; transition: transform 0.1s; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .color-btn:hover { transform: scale(1.1); z-index: 10; border-color: var(--text); }
        .color-btn.active { border: 2px solid var(--text); }

        /* Editor chrome around the page, in Branding tokens. The résumé itself
           keeps the colours the user picks (--cv-accent). */
        .ui-accent { color: var(--accent); }
        .ui-border { border-color: var(--border); }
        .bg-accent { background-color: var(--accent); }
        .ui-panel { background: var(--bg-elev); border-color: var(--border); }
        .ui-hover:hover { background: var(--border); }
        .ui-dashed { border-color: var(--border); color: var(--text-muted); }
        .ui-dashed:hover { border-color: var(--accent); color: var(--text); }

        /* Workspace: settings rail (left) · page (centre) · Add rail (right).
           Body is a flex column so the navbar never scrolls away; the pane and
           both rails scroll on their own. */
        html, body { height: 100%; }
        body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        #root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        #carinoNav { flex-shrink: 0; }
        .vitae-ws { flex: 1 1 auto; min-height: 0; }
        .vitae-ws .ws-rail { min-height: 0; }
        .vitae-rail .field { min-width: 0; }
        .vitae-rail .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .vitae-rail input[type="range"] { width: 100%; accent-color: var(--accent); }
        .vitae-rail .hint { margin: 2px 0 0 23px; font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.45; }
        .vitae-pane { position: relative; }
        .vitae-pane .ws-toggle { position: sticky; top: 0; z-index: 30; margin-bottom: 12px; background: var(--bg); }
        /* The page is drawn at its real size (210mm and so on) and zoomed to fit
           the pane, so a phone shows the whole sheet instead of a corner of it.
           Print resets the zoom. */
        .vitae-doc { display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 12px 16px 80px; width: max-content; min-width: 100%; }
        .vitae-add {
            width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 16px 0; background: var(--bg-card); border-left: 1px solid var(--border); overflow-y: auto;
        }
        .vitae-add .add-lbl { font-family: var(--mono); font-size: var(--fs-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
        .vitae-tool {
            width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; color: var(--text-sec); transition: 0.15s;
        }
        .vitae-tool:hover, .vitae-tool.active { background: var(--accent); border-color: var(--accent); color: #050505; }
        .vitae-tool.round { width: 32px; height: 32px; border-radius: 50%; margin-top: auto; }
        .vitae-pane .short-hero { padding-top: clamp(16px, 6vh, 56px); }
        .vitae-pane .short-hero .gold { color: var(--accent); }
        .vitae-pane .sh-input { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .vitae-pane .sh-input .dropzone { width: 100%; }
        /* Phones: the Add strip would take width from the page, so the tools
           move to the top of the settings drawer and the page zooms larger. */
        .vitae-rail-add, .vitae-rail-links { display: none; }
        .vitae-rail-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .vitae-rail-tool { justify-content: flex-start; gap: 8px; padding: 8px 10px; min-width: 0; }
        .vitae-rail-tool svg { width: 16px; height: 16px; flex: none; }
        .vitae-rail-tool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vitae-rail-links { margin: 8px 0 0; font-size: var(--fs-sm); color: var(--text-muted); }
        .vitae-rail-links a { color: var(--text-sec); }
        .vitae-rail-links a:hover { color: var(--accent); }
        @media (max-width: 640px) {
            .vitae-add { display: none; }
            .vitae-rail-add { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
            .vitae-rail-links { display: block; }
            .vitae-doc { padding: 8px 8px 64px; }
        }
        @media print {
            #carinoNav { display: none !important; }
            body { display: block; overflow: visible; }
            #root { display: block; overflow: visible; }
        }
    </style>
</head>
