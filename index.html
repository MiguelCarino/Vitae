    <style>
        /* --- CORE STYLES --- */
        :root {
            --accent: #0ea5e9;
            --page-margin: 35px;
            --module-gap: 15px; /* vertical space between stacked sections */
            --item-gap: 0px;    /* internal space inside a section */
        }
        body { background-color: #050505; color: #fff; font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden; }
        
        /* PAGE DIMENSIONS */
        .page-container {
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            color: #1e293b;
            padding: var(--page-margin);
            overflow: visible; 
            transition: width 0.3s, min-height 0.3s;
        }
        
        /* Size Classes */
        .size-a4 { width: 210mm; min-height: 297mm; }
        .size-letter { width: 215.9mm; min-height: 279.4mm; }
        .size-legal { width: 215.9mm; min-height: 355.6mm; }

        /* The Grid. Column gap separates the two tracks; row gap is the
           section rhythm, so --module-gap alone controls vertical spacing. */
        .resume-grid { display: grid; grid-template-columns: 7fr 5fr; column-gap: 2.5rem; row-gap: var(--module-gap); }
        /* ATS mode. The child override matters: col-left/col-right pin an
           explicit grid-column, which would otherwise conjure an implicit
           second track back into existence. */
        .resume-grid.ats { grid-template-columns: 1fr; column-gap: 0; }
        .resume-grid.ats > * { grid-column: 1 / -1; }
        .col-full { grid-column: 1 / -1; }
        .col-left { grid-column: 1 / 2; }
        .col-right { grid-column: 2 / 3; }
        
        /* SPACING SYSTEM */
        .section-item {
            position: relative;
            break-inside: avoid;
        }

        /* Internal spacing */
        .dynamic-gap { gap: var(--item-gap); }
        .dynamic-mb { margin-bottom: var(--item-gap); }
        .tag-container { gap: var(--item-gap); }
        
        /* Links */
        a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
        a:hover { border-bottom-style: solid; }

        /* Print Overrides - STRICT GAP REMOVAL */
        @media print {
            body, html { background: white; margin: 0; padding: 0; overflow: visible; height: 100%; }
            #app-ui, .no-print, .menu-bridge, .page-delete-btn { display: none !important; }
            
            .page-container {
                box-shadow: none; 
                margin: 0; 
                padding: var(--page-margin) !important;
                border: none; 
                page-break-after: always;
                /* Do NOT reassert the on-screen paper height here. .size-* is
                   exactly one sheet, and @page margin is 0, so any rounding
                   over that emits a trailing blank page. page-break-after
                   already does the pagination. */
                min-height: 0;
                height: auto;
            }
            .page-container:last-child { page-break-after: auto; }
            
            /* Ensure icons align perfectly in print */
            .icon-wrapper { margin-right: 6px !important; display: inline-block; vertical-align: middle; }

            /* Empty fields must not print their placeholder. CSS-generated
               content also lands in the PDF text layer, which breaks ATS
               parsing as well as looking like stray grey text. */
            .editable:empty:before { content: none !important; }
        }

        /* Editable Areas */
        .editable { min-width: 10px; display: inline-block; }
        .editable:empty:before { content: attr(placeholder); opacity: 0.3; }
        .editable:focus { outline: none; background: rgba(234,179,8,.15); border-radius: 2px; }
        
        /* Control Menu Bridge */
        .menu-bridge { position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px; }
        
        /* Sidebar Tooltip */
        .sidebar-tooltip {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            left: 4.5rem; 
            bottom: 1.5rem;
            width: 250px;
            background: #0d0d0d;
            color: #a3a3a3;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #262626;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s;
            z-index: 100;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .sidebar-tooltip.active { visibility: visible; opacity: 1; pointer-events: auto; }

        /* Color Picker Grid */
        .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .color-btn { width: 100%; height: 18px; border-radius: 4px; transition: transform 0.1s; border: 1px solid rgba(255,255,255,0.1); }
        .color-btn:hover { transform: scale(1.1); z-index: 10; border-color: white; }
        .color-btn.active { border: 2px solid white; }

        /* Carino brand palette for the EDITOR chrome only — the resume
           document keeps its own user-picked colors. Loaded after
           tailwind.css so these win over same-specificity utilities. */
        .ui-accent { color: #eab308; }
        .ui-sec { color: #a3a3a3; }
        .ui-muted { color: #666; }
        .ui-border { border-color: #262626; }
        .bg-accent { background-color: #eab308; }
        .ui-input { background: #0d0d0d; border-color: #262626; }
        .ui-panel { background: #0d0d0d; border-color: #262626; }
        .ui-range { accent-color: #eab308; background: #262626; }
        .ui-hover:hover { background: #262626; }
        .ui-link:hover { color: #eab308; }
        .ui-tool { background: #0d0d0d; border-color: #262626; color: #a3a3a3; }
        .ui-tool:hover, .ui-tool.active { background: #eab308; border-color: #eab308; color: #050505; }
        .ui-dashed { border-color: #262626; color: #666; }
        .ui-dashed:hover { border-color: #eab308; color: #fff; }
        .btn-primary { background: #eab308; color: #050505; }
        .btn-primary:hover { background: #fbbf24; }

        /* Carino navbar merge: one sticky top bar (the injected #carinoNav), the
           resume controls are portaled into it. Body is a flex column so the nav
           never scrolls away — only the workspace scrolls. */
        html, body { height: 100%; }
        body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        #root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        #carinoNav { flex-shrink: 0; }
        #resumeActions { flex-wrap: nowrap; }
        @media print {
            #carinoNav { display: none !important; }
            body { display: block; overflow: visible; }
            #root { display: block; overflow: visible; }
        }
    </style>
